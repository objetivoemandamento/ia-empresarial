name: Homologation gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**", "homologacao/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homologation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source integrity and automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require imported source tree
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "package.json"
            "backend/requirements.txt"
            "backend/app/main.py"
            "backend/app/human_tasks.py"
            "backend/migrations/versions/0008_human_tasks.py"
            "frontend/src/App.tsx"
          )
          missing=()
          for path in "${required[@]}"; do
            [[ -f "$path" ]] || missing+=("$path")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'BLOCKED: source tree is incomplete; missing required files:\n'
            printf ' - %s\n' "${missing[@]}"
            printf '\nDo not deploy. Import the verified source from commit 7996d60 into a homologation branch.\n'
            exit 1
          fi

      - name: Check for committed environment and private-key files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|id_rsa|credentials\.json|[^/]+\.pem$|[^/]+\.key$)'; then
            echo "Blocked: potential secret-bearing file is tracked."
            exit 1
          fi
          if git grep -n -I -E '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}' -- ':!*.zip'; then
            echo "Blocked: high-confidence credential pattern found. Rotate any exposed credential."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest -q backend
