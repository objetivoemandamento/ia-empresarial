name: Validate Escritório de IAs

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main, 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m pytest -q --cov=backend/app --cov-report=term backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm --prefix frontend install --no-audit --no-fund
      - run: npm --prefix frontend run build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend install --no-audit --no-fund
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-test-results
          path: frontend/test-results/
          retention-days: 7
  
  package-source:
    runs-on: ubuntu-latest
    needs: [backend, frontend, browser-smoke]
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=ia-empresarial-validated.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ia-empresarial-validated-source
          path: ia-empresarial-validated.zip
          retention-days: 7
