services:
  - type: web
    name: modular-ai-workspace-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: AI_ROUTER_MODELS_JSON
        sync: false
    disk:
      name: modular-ai-data
      mountPath: /var/data
      sizeGB: 1
